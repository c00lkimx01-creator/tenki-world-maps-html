<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Weather Platform</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        glass: {
                            light: 'rgba(255, 255, 255, 0.75)',
                            dark: 'rgba(30, 41, 59, 0.85)'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <!-- Phosphor Icons for beautiful scalable icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a; /* Fallback dark background */
        }

        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            /* Prevents flash of white when map loads in dark mode */
            background-color: #0f172a; 
        }
        
        html.light #map {
            background-color: #e2e8f0;
        }

        /* Premium Glassmorphism Panel */
        .glass-panel {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.15);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        html.dark .glass-panel {
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px -4px rgba(0, 0, 0, 0.5);
        }

        /* Ensure UI elements float above the Leaflet map */
        .ui-layer { z-index: 1000; }
        
        /* Transparent Leaflet container background */
        .leaflet-container { background: transparent !important; }

        /* Custom Range Slider Styling for Timeline */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 2px;
        }
        html.dark input[type=range]::-webkit-slider-runnable-track { background: #475569; }

        /* Custom Popup Styling for Leaflet */
        .leaflet-popup-content-wrapper {
            background-color: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(8px);
            color: #1e293b !important;
            border-radius: 12px !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2) !important;
        }
        html.dark .leaflet-popup-content-wrapper {
            background-color: rgba(30, 41, 59, 0.9) !important;
            color: #f1f5f9 !important;
        }
        html.dark .leaflet-popup-tip { background-color: rgba(30, 41, 59, 0.9) !important; }
        .leaflet-popup-content { margin: 14px 16px !important; }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-100 transition-colors duration-300 antialiased font-sans">

    <div id="map"></div>

    <!-- Top Left Panel: App Title, Clock, Date, and Legend -->
    <div class="ui-layer absolute top-4 left-4 sm:top-6 sm:left-6 flex flex-col pointer-events-none">
        <div class="glass-panel bg-glass-light dark:bg-glass-dark p-4 sm:p-5 rounded-2xl flex flex-col gap-1 w-64 sm:w-72 pointer-events-auto">
            <div class="flex items-center gap-2 mb-1 text-blue-600 dark:text-blue-400">
                <i class="ph-fill ph-cloud-rain text-2xl"></i>
                <h1 class="text-base font-bold tracking-wide">Weather Platform</h1>
            </div>
            
            <div id="time-display" class="text-3xl sm:text-4xl font-light tracking-wide tabular-nums mt-1 text-slate-800 dark:text-white">--:--:--</div>
            <div id="date-display" class="text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-400 mt-1">Loading date...</div>
            
            <!-- Precipitation Legend matching RainViewer Scheme 2 -->
            <div class="mt-4 pt-3 border-t border-slate-300 dark:border-slate-700">
                <div class="text-[10px] font-bold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wider">Precipitation (mm/h)</div>
                <div class="h-2 w-full rounded-full bg-gradient-to-r from-[#00FFFF] via-[#FFFF00] to-[#FF0000]"></div>
                <div class="flex justify-between text-[10px] mt-1 text-slate-500 dark:text-slate-400 font-medium">
                    <span>Light</span>
                    <span>Heavy</span>
                </div>
            </div>
            
            <div class="mt-2 text-[10px] text-slate-500 dark:text-slate-400 flex items-center gap-1">
                <i class="ph ph-info"></i> Click anywhere on the map for local weather
            </div>
        </div>
    </div>

    <div class="ui-layer absolute top-4 right-4 sm:top-6 sm:right-6 pointer-events-auto flex flex-col gap-3">
        <!-- Theme Toggle Button -->
        <button id="theme-toggle" class="glass-panel bg-glass-light dark:bg-glass-dark w-12 h-12 rounded-full flex items-center justify-center transition-transform hover:scale-105 active:scale-95 text-slate-700 dark:text-slate-200" title="Toggle Light/Dark Mode">
            <i class="ph ph-moon text-2xl dark:hidden"></i>
            <i class="ph ph-sun text-2xl hidden dark:block text-yellow-400"></i>
        </button>
    </div>

    <!-- Bottom Timeline Controls (Play/Pause, Slider, Time indicator) -->
    <div class="ui-layer absolute bottom-6 left-1/2 -translate-x-1/2 w-[95%] max-w-3xl pointer-events-none">
        <div class="glass-panel bg-glass-light dark:bg-glass-dark p-4 rounded-2xl pointer-events-auto flex flex-col sm:flex-row items-center gap-4">
            
            <!-- Play/Pause Animation -->
            <button id="play-btn" class="w-12 h-12 rounded-full bg-blue-500 hover:bg-blue-600 text-white flex items-center justify-center shadow-lg transition-colors flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
                <i id="play-icon" class="ph-fill ph-play text-2xl ml-1"></i>
            </button>

            <!-- Slider Wrapper -->
            <div class="flex-grow w-full flex flex-col gap-2">
                <div class="flex justify-between items-end">
                    <span id="frame-time" class="text-lg font-bold text-slate-800 dark:text-white tabular-nums">
                        Loading Radar Data...
                    </span>
                    <span id="frame-status" class="text-xs font-semibold px-2 py-1 rounded-md bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300">
                        -
                    </span>
                </div>
                
                <input type="range" id="timeline-slider" min="0" max="100" value="0" step="1" disabled class="w-full">
            </div>
        </div>
    </div>

    <!-- Leaflet JS Map Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <script>
        // --- State & Config ---
        let map;
        let baseTileLayer;
        let isDarkMode = true; // Default theme
        
        // RainViewer Timeline State
        let radarFrames = [];
        let currentFrameIndex = 0;
        let animationInterval = null;
        const ANIMATION_SPEED = 600; // ms per frame playback

        // CartoDB Map Tiles (Public, No API Key needed, clean aesthetic)
        const CARTO_TILES = {
            light: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
            dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
        };

        // Open-Meteo WMO Weather codes to Text & Icon mapping
        const WMO_CODES = {
            0: { text: 'Clear sky', icon: 'ph-sun' },
            1: { text: 'Mainly clear', icon: 'ph-sun-dim' },
            2: { text: 'Partly cloudy', icon: 'ph-cloud-sun' },
            3: { text: 'Overcast', icon: 'ph-cloud' },
            45: { text: 'Fog', icon: 'ph-cloud-fog' },
            48: { text: 'Depositing rime fog', icon: 'ph-cloud-fog' },
            51: { text: 'Light Drizzle', icon: 'ph-cloud-rain' },
            53: { text: 'Moderate Drizzle', icon: 'ph-cloud-rain' },
            55: { text: 'Dense Drizzle', icon: 'ph-cloud-rain' },
            61: { text: 'Slight Rain', icon: 'ph-cloud-rain' },
            63: { text: 'Moderate Rain', icon: 'ph-cloud-rain' },
            65: { text: 'Heavy Rain', icon: 'ph-cloud-lightning' },
            71: { text: 'Slight Snow', icon: 'ph-snowflake' },
            73: { text: 'Moderate Snow', icon: 'ph-snowflake' },
            75: { text: 'Heavy Snow', icon: 'ph-snowflake' },
            95: { text: 'Thunderstorm', icon: 'ph-cloud-lightning' },
            99: { text: 'Thunderstorm with Hail', icon: 'ph-cloud-lightning' }
        };

        // Static Major Cities for quick reference markers
        const MAJOR_CITIES = [
            { name: "Tokyo", lat: 35.6762, lng: 139.6503 },
            { name: "New York", lat: 40.7128, lng: -74.0060 },
            { name: "London", lat: 51.5074, lng: -0.1278 },
            { name: "Sydney", lat: -33.8688, lng: 151.2093 }
        ];

        
        // --- 1. Clock functionality ---
        function updateClock() {
            const now = new Date();
            document.getElementById('time-display').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            document.getElementById('date-display').textContent = now.toLocaleDateString([], { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. Theme Switching ---
        function applyTheme() {
            const html = document.documentElement;
            if (isDarkMode) html.classList.add('dark');
            else html.classList.remove('dark');
            updateBaseMapLayer();
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            applyTheme();
        });

        function updateBaseMapLayer() {
            if (!map) return;
            if (baseTileLayer) map.removeLayer(baseTileLayer);
            
            const tileUrl = isDarkMode ? CARTO_TILES.dark : CARTO_TILES.light;
            baseTileLayer = L.tileLayer(tileUrl, {
                attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                subdomains: 'abcd',
                minZoom: 2, 
                maxZoom: 18,
                noWrap: true // CRITICAL: Prevent horizontal repetition of the base map
            }).addTo(map);

            // Ensure rain layers stay on top of the newly added base map
            radarFrames.forEach(frame => {
                if (frame.layer) frame.layer.bringToFront();
            });
        }

        
        // --- 3. Open-Meteo API Integration (On Click & Markers) ---
        async function fetchWeatherAtLocation(lat, lng) {
            try {
                // Fetch current weather based on coordinates using Open-Meteo Free API
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("Weather data unavailable");
                const data = await response.json();
                return data.current_weather;
            } catch (error) {
                console.error(error);
                return null;
            }
        }

        async function onMapClick(e) {
            const { lat, lng } = e.latlng;
            
            // Show loading popup immediately
            const popup = L.popup()
                .setLatLng(e.latlng)
                .setContent(`<div class="flex items-center gap-2"><div class="animate-spin h-4 w-4 border-2 border-blue-500 border-t-transparent rounded-full"></div><span>Fetching weather...</span></div>`)
                .openOn(map);

            const weather = await fetchWeatherAtLocation(lat, lng);
            
            if (weather) {
                const wmoInfo = WMO_CODES[weather.weathercode] || { text: 'Unknown', icon: 'ph-question' };
                const htmlContent = `
                    <div class="min-w-[150px] p-1">
                        <div class="font-bold text-sm text-slate-500 dark:text-slate-400 mb-1">
                            ${lat.toFixed(2)}°, ${lng.toFixed(2)}°
                        </div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-3xl font-light">${weather.temperature}°C</span>
                            <i class="ph ${wmoInfo.icon} text-3xl text-blue-500"></i>
                        </div>
                        <div class="text-sm font-medium capitalize mb-1">${wmoInfo.text}</div>
                        <div class="text-xs flex items-center gap-1 opacity-75">
                            <i class="ph ph-wind"></i> Wind: ${weather.windspeed} km/h
                        </div>
                    </div>
                `;
                popup.setContent(htmlContent);
            } else {
                popup.setContent(`<div class="text-red-500 font-medium">Failed to load data.</div>`);
            }
        }

        function addCityMarkers() {
            // Add static markers for major cities
            const customIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="w-3 h-3 bg-blue-500 border-2 border-white dark:border-slate-800 rounded-full shadow-md"></div>`,
                iconSize: [12, 12],
                iconAnchor: [6, 6]
            });

            MAJOR_CITIES.forEach(city => {
                const marker = L.marker([city.lat, city.lng], { icon: customIcon }).addTo(map);
                marker.bindTooltip(city.name, { direction: 'top', offset: [0, -10], className: 'font-semibold text-xs rounded shadow-sm' });
                marker.on('click', (e) => {
                    // Stop map click propagation and trigger weather popup
                    L.DomEvent.stopPropagation(e);
                    onMapClick({ latlng: e.latlng });
                });
            });
        }


        // --- 4. RainViewer API (Radar Animation) ---
        async function fetchRainRadarData() {
            try {
                const response = await fetch('https://api.rainviewer.com/public/weather-maps.json');
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                // Clear old layers
                radarFrames.forEach(frame => {
                    if (frame.layer && map.hasLayer(frame.layer)) map.removeLayer(frame.layer);
                });
                radarFrames = [];

                // Combine past and future data streams
                const pastFrames = (data.radar.past || []).map(f => ({ ...f, type: 'past' }));
                const futureFrames = (data.radar.nowcast || []).map(f => ({ ...f, type: 'future' }));
                const combinedData = [...pastFrames, ...futureFrames];

                if (combinedData.length === 0) return;

                // Create and preload layers for seamless toggling
                combinedData.forEach((frameData, index) => {
                    // Structure: host + path + size + /z/x/y/ + colorscheme(2) + smooth(1_1)
                    const radarTileUrl = `${data.host}${frameData.path}/256/{z}/{x}/{y}/2/1_1.png`;
                    
                    const layer = L.tileLayer(radarTileUrl, {
                        opacity: 0, // start hidden to prevent visual clutter
                        zIndex: 10 + index,
                        transparent: true,
                        noWrap: true // CRITICAL: Prevent rain from drawing outside the maxBounds world
                    }).addTo(map);

                    radarFrames.push({
                        time: frameData.time,
                        type: frameData.type,
                        layer: layer
                    });
                });

                // Configure timeline slider
                const slider = document.getElementById('timeline-slider');
                slider.max = radarFrames.length - 1;
                slider.disabled = false;
                document.getElementById('play-btn').disabled = false;
                
                // Start showing the current time (latest past frame)
                currentFrameIndex = pastFrames.length - 1;
                if(currentFrameIndex < 0) currentFrameIndex = 0;
                
                slider.value = currentFrameIndex;
                updateTimelineFrameUI();

            } catch (error) {
                console.error("RainViewer Fetch Error:", error);
                document.getElementById('frame-time').textContent = "Radar Data Unavailable";
            }
        }

        function updateTimelineFrameUI() {
            if (radarFrames.length === 0) return;
            
            // 1. Toggling opacities for the current frame
            radarFrames.forEach((frame, index) => {
                if (index === currentFrameIndex) {
                    frame.layer.setOpacity(0.85); // Make active layer visible
                } else {
                    frame.layer.setOpacity(0); // Hide others
                }
            });

            // 2. Update descriptive text UI
            const activeFrame = radarFrames[currentFrameIndex];
            const frameDate = new Date(activeFrame.time * 1000); // Unix to JS Date
            
            const timeStr = frameDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('frame-time').textContent = `${timeStr} (Local)`;
            
            const statusEl = document.getElementById('frame-status');
            if (activeFrame.type === 'past') {
                statusEl.textContent = 'Past / Current';
                statusEl.className = 'text-xs font-semibold px-2 py-1 rounded-md bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300';
            } else {
                statusEl.textContent = 'Nowcast Forecast';
                statusEl.className = 'text-xs font-semibold px-2 py-1 rounded-md bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300';
            }
            
            // Update physical slider position if changed programmatically
            document.getElementById('timeline-slider').value = currentFrameIndex;
        }


        function playTimeline() {
            if (animationInterval) return; 
            
            document.getElementById('play-icon').classList.replace('ph-play', 'ph-pause');
            document.getElementById('play-icon').classList.remove('ml-1'); 
            
            // Auto restart if at the very end
            if (currentFrameIndex >= radarFrames.length - 1) {
                currentFrameIndex = 0;
                updateTimelineFrameUI();
            }

            animationInterval = setInterval(() => {
                currentFrameIndex++;
                if (currentFrameIndex >= radarFrames.length) {
                    currentFrameIndex = 0; // Loop seamlessly
                }
                updateTimelineFrameUI();
            }, ANIMATION_SPEED);
        }

        function pauseTimeline() {
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }
            document.getElementById('play-icon').classList.replace('ph-pause', 'ph-play');
            document.getElementById('play-icon').classList.add('ml-1');
        }

        // DOM Listeners for Timeline
        document.getElementById('play-btn').addEventListener('click', () => {
            if (animationInterval) pauseTimeline();
            else playTimeline();
        });

        document.getElementById('timeline-slider').addEventListener('input', (e) => {
            pauseTimeline(); // Stop animation when user interacts
            currentFrameIndex = parseInt(e.target.value);
            updateTimelineFrameUI();
        });

        // --- 5. Application Initialization ---
        function initApp() {
            // CRITICAL: Prevent panning out of bounds. Define Map Limits
            const bounds = [
                [-90, -180], // South West coordinate
                [90, 180]    // North East coordinate
            ];

            map = L.map('map', {
                center: [35.0, 135.0],       // Initial center (around Japan/Asia)
                zoom: 4,                     // Initial zoom
                minZoom: 3,                  // Prevent zooming out too far to show empty space
                maxBounds: bounds,           // Restrict panning strictly to world coordinates
                maxBoundsViscosity: 1.0,     // Solid wall feeling when dragging to edge
                zoomControl: false,          // Disable default zoom to keep UI clean
            });

            // Initialize visual elements
            applyTheme();
            addCityMarkers();
            
            // Bind click anywhere on map for weather popup
            map.on('click', onMapClick);

            // Fetch radar data
            fetchRainRadarData();
            
            // Auto-refresh radar data every 10 minutes to stay live
            setInterval(fetchRainRadarData, 10 * 60 * 1000);
        }

        // Start everything once the DOM is fully loaded
        window.addEventListener('load', initApp);
    </script>
</body>
</html>
